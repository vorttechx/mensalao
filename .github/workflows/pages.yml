# Publica o SITE (mensalao.app: apresentação, política, app-ads.txt e sw.js de autodestruição) no GitHub
# Pages a cada push na main (ou pela aba Actions). O app NÃO é publicado: ele só existe no pacote Android
# (US-31.CA1/CA12). O build do app continua sendo gerado e verificado aqui, mas não sobe.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds do app (produção e teste), cap sync, site e todas as verificações (provedores falsos, IDs do
      # AdMob, domínios de anúncio, URLs externas e a pasta do site sem o app web).
      - run: npm run verificar:bundle
        env:
          # Domínio próprio: a variável MENSALAO_DOMINIO grava o CNAME na pasta do site.
          MENSALAO_DOMINIO: ${{ vars.MENSALAO_DOMINIO }}
          # Ficha da Play (R-21): enquanto vazia, a página mostra "Em breve na Google Play".
          MENSALAO_URL_PLAY: ${{ vars.MENSALAO_URL_PLAY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
