# Verifica cada PR antes do merge: build, testes unitários, testes de interface e bundle de produção.
# O job se chama "CI" porque é esse o check exigido pela proteção da main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Gera os builds de produção e de teste, roda `npx cap sync android` (sem Android SDK) e falha se o
      # provedor falso estiver na produção (US-12.CA14), se houver ID real do AdMob fora da produção, domínio
      # de anúncio na parte web ou URL externa fora da lista permitida (US-30.CA2, US-29.CA8, US-30.CA11).
      # Não precisa de conta AdMob, de aparelho nem de rede de anúncio (US-30.CA7).
      - run: npm run verificar:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
